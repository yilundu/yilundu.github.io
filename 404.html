  <style>
    :root {
      --text: #283238;
      --muted: #536168;
      --heading: #244252;
      --link: #356b58;
      --link-hover: #244d40;
      --line: #d9e2df;
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --display-font: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: var(--text);
      font-family: var(--font);
      font-size: 17px;
      line-height: 1.62;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(640px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0 64px;
    }
    .home {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: var(--heading);
      font-family: var(--display-font);
      font-size: 22px;
      font-weight: 600;
      text-decoration: none;
    }
    .home img {
      width: 48px;
      height: 48px;
      border-radius: 5px;
      object-fit: cover;
    }
    h1 {
      margin: 40px 0 10px;
      color: var(--heading);
      font-family: var(--display-font);
      font-size: clamp(30px, 6vw, 38px);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    p { margin: 0 0 22px; color: var(--muted); }
    ul {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 22px;
      margin: 0;
      padding: 18px 0 0;
      border-top: 1px solid var(--line);
      list-style: none;
      font-weight: 600;
    }
    a { color: var(--link); }
    a:hover { color: var(--link-hover); }
    ul a { text-decoration: none; }
    ul a:hover { text-decoration: underline; text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid #8b6325; outline-offset: 3px; }
  </style>
</head>
